services:
  python:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python
    environment:
      - TIMEZONE=${TIMEZONE}
      - COOP_LATITUDE=${COOP_LATITUDE}
      - COOP_LONGITUDE=${COOP_LONGITUDE}
      - OMLET_API_TOKEN=${OMLET_API_TOKEN}
      - OMLET_DEVICE_ID=${OMLET_DEVICE_ID}
      - EARLIEST_OPEN_TIME=${EARLIEST_OPEN_TIME}
      - LATEST_OPEN_TIME=${LATEST_OPEN_TIME}
      - EARLIEST_CLOSE_TIME=${EARLIEST_CLOSE_TIME}
      - LATEST_CLOSE_TIME=${LATEST_CLOSE_TIME}
    volumes:
      - .:/usr/src/app
    restart: no